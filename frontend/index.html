<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hestia — Gestión de Insumos</title>
    <link rel="icon" href="/logo_hestia.svg" />
    <!-- Anti-FOUC: aplica clase dark antes de que React monte -->
    <script>
      try {
        var t = localStorage.getItem('hestia-theme');
        if (t) {
          var s = JSON.parse(t);
          if (s && s.state && s.state.isDark) {
            document.documentElement.classList.add('dark');
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
