name: Validación de código

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pip-audit

      - name: Verificar sintaxis con flake8
        run: |
          cd backend
          flake8 app/ --max-line-length=100 --exclude=__pycache__ --count --statistics

      - name: Escanear vulnerabilidades en dependencias Python
        run: pip-audit -r requirements.txt --progress-spinner=off

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias frontend
        run: cd frontend && npm ci

      # Bloqueante: solo dependencias de runtime (el codigo que llega al navegador).
      - name: Escanear vulnerabilidades en dependencias frontend (runtime)
        run: cd frontend && npm audit --omit=dev --audit-level=high

      # Informativo: incluye herramientas de build (tailwindcss 3, vite, etc.).
      # No bloquea: las altas restantes de la cadena de tailwindcss 3 no tienen
      # correccion sin salto mayor. Ver "Limitaciones conocidas" en el README.
      - name: Auditoría completa (informativa, incluye herramientas de build)
        continue-on-error: true
        run: cd frontend && npm audit --audit-level=high
