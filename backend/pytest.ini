[pytest]
testpaths = tests
# no:anyio -> el plugin de pytest que trae anyio no se usa y emite un aviso
# de obsolescencia con pytest 9.
addopts = -ra -p no:cacheprovider -p no:anyio
# Un caso marcado como fallo esperado (xfail) que empieza a pasar se reporta
# como error: obliga a revisar la marca cuando se corrige el defecto.
xfail_strict = true
markers =
    caso(id, descripcion, esperado): caso documentado en docs/PRUEBAS.md
# Starlette 1.3 prefiere httpx2 para TestClient, pero httpx2 exige idna>=3.18 y
# produccion fija idna 3.15 (ver requirements-dev.txt). httpx sigue soportado.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
